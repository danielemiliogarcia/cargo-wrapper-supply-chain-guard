[package]
name = "cargo-wrapper-supply-chain-guard"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Pre-execution supply-chain guard plugin for Cargo Wrapper"
repository = "https://github.com/danielemiliogarcia/cargo-wrapper-supply-chain-guard"

[[bin]]
name = "cargo-wrapper-plugin-supply-chain-guard"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tempfile = "3.20"

[dev-dependencies]

# The profile used for reproducible release artifacts generated by dist.
[profile.dist]
inherits = "release"
lto = "thin"
